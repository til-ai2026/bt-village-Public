<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>노리나루마을 (2단계)</title>
<script>window.T0 = performance.now();</script>
<style>
:root { --panel:rgba(12,18,28,.78); --fg:#f4f7fb; --mute:#9fb0c6; --ok:#7df0b5; --warn:#ffc93c; --bad:#ff7a7a; --accent:#ff8a3d; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:#bfe6ff; color:var(--fg); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
button { font:inherit; border:0; border-radius:24px; cursor:pointer; }
#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
.screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:22px; padding:24px; z-index:5; }
.screen.on { display:flex; }
#s-start { background:linear-gradient(#8fd3ff,#d9f3ff); color:#173049; }
#s-start h1 { margin:0; font-size:52px; }
#s-start p { margin:0; font-size:20px; color:#355a7a; }
.big { min-height:88px; min-width:260px; padding:16px 44px; font-size:36px; font-weight:900; background:var(--accent); color:#fff; box-shadow:0 8px 0 #c95f1c; }
.big:active { transform:translateY(4px); box-shadow:0 4px 0 #c95f1c; }
#s-load { background:linear-gradient(#8fd3ff,#d9f3ff); color:#173049; }
#s-load h2 { margin:0; font-size:36px; }
.bar { width:min(520px,70vw); height:26px; background:#fff; border-radius:13px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.15); }
.bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
#loadMsg { font-size:18px; color:#355a7a; }
#skip { min-height:64px; padding:0 32px; font-size:24px; font-weight:800; background:#fff; color:#173049; }
#s-select { background:#fff7ec; color:#3a2410; z-index:6; }
#s-select h2 { margin:0; font-size:44px; }
#s-select p { margin:0; font-size:20px; color:#8a6a4a; }
#back { min-height:72px; padding:0 36px; font-size:26px; font-weight:800; background:#3c8dff; color:#fff; }

#status { position:fixed; left:10px; bottom:10px; z-index:4; pointer-events:none; background:var(--panel); border-radius:14px; padding:8px 12px; font:13px/1.5 ui-monospace,Menlo,monospace; display:none; max-width:48vw; }
#status.on { display:block; }
#status b { color:var(--mute); font-weight:600; }
#status .ok { color:var(--ok); } #status .warn { color:var(--warn); } #status .bad { color:var(--bad); }
#portrait { position:fixed; left:0; right:0; bottom:0; background:#3a2b10; color:var(--warn); text-align:center; padding:8px; font-size:16px; display:none; z-index:9; }
@media (orientation:portrait) { #portrait { display:block; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<section class="screen on" id="s-start">
  <h1>노리나루마을</h1>
  <p>START를 누르면 소리가 켜집니다</p>
  <button class="big" id="btnStart">START</button>
</section>

<section class="screen" id="s-load">
  <h2>마을로 가는 중…</h2>
  <div class="bar"><i id="barFill"></i></div>
  <div id="loadMsg">준비 중</div>
  <button id="skip">건너뛰기</button>
</section>

<section class="screen" id="s-select">
  <h2>활동놀이</h2>
  <p>미션 선택 (3단계에서 채웁니다)</p>
  <button id="back">마을로 돌아가기</button>
</section>

<div id="status"></div>
<div id="portrait">가로 화면으로 돌려 주세요</div>

<script type="module">
const $ = s => document.querySelector(s);
const T0 = window.T0;
const T = { start: 0, three: 0, scene: 0, ready: 0 };
const q = new URLSearchParams(location.search);
const DPR = Math.min(window.devicePixelRatio || 1, +(q.get('dpr') || 1.5));

/* Three.js는 첫 화면이 열리자마자 미리 불러옵니다 */
let THREE;
const threeP = import('../lib/three/three.module.min.js').then(m => { THREE = m; T.three = performance.now(); return m; });

/* ---------- START: 소리 켜기 (Safari는 터치 안에서만 허용) ---------- */
let audio = null;
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audio = new AC();
    const b = audio.createBuffer(1, 1, 22050), s = audio.createBufferSource();
    s.buffer = b; s.connect(audio.destination); s.start(0);
    audio.resume();
  } catch (e) { audio = null; }
}

const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
let skip = false;
$('#btnStart').onclick = () => { T.start = performance.now(); unlockAudio(); show('s-load'); boot(); };
$('#skip').onclick = () => { skip = true; $('#loadMsg').textContent = '준비되면 바로 들어갑니다'; };

const prog = (p, msg) => { $('#barFill').style.width = p + '%'; $('#loadMsg').textContent = msg; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const INTRO_MS = 2500;  // 건너뛰지 않으면 로딩 화면을 최소 이만큼 보여 줌

async function boot() {
  try {
    prog(15, '3D 엔진 불러오는 중');
    await threeP;
    prog(50, '마을 만드는 중');
    await wait(16);
    build();
    T.scene = performance.now();
    prog(80, '그리는 중');
    await wait(16);
    renderer.compile(scene, camera);
    renderer.render(scene, camera);
    prog(100, '준비 완료');
    while (!skip && performance.now() - T.start < INTRO_MS) await wait(50);
    show('');
    $('#status').classList.add('on');
    T.ready = performance.now();
    loop.last = performance.now();
    requestAnimationFrame(frame);
  } catch (e) {
    prog(0, '마을을 불러오지 못했습니다: ' + (e && e.message || e));
  }
}

/* ---------- 장면 ---------- */
let renderer, scene, camera, player, npc, ground, marker, starMark;
const buildings = [];
const colliders = [];
const BLD = [
  { id: 'activity', name: '활동놀이', open: true,  pos: [0, -11],  size: [6.5, 4.2, 5], body: 0xffb347, roof: 0xe84a5f },
  { id: 'science',  name: '과학',     open: false, pos: [-10, -6], size: [5, 3.6, 4.5], body: 0x9ec9ff, roof: 0x5a7fbf },
  { id: 'math',     name: '수학',     open: false, pos: [10, -6],  size: [5, 3.6, 4.5], body: 0xb6e3a0, roof: 0x5f9e4a },
  { id: 'music',    name: '음악',     open: false, pos: [-11, 3],  size: [5, 3.6, 4.5], body: 0xf7c6e0, roof: 0xb05a8c },
  { id: 'video',    name: '내 영상',  open: false, pos: [11, 3],   size: [5, 3.6, 4.5], body: 0xfff1a8, roof: 0xc9a227 },
];

function label(text, { bg = 'rgba(255,255,255,.95)', fg = '#173049', w = 3.6 } = {}) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 112;
  const g = cv.getContext('2d');
  g.fillStyle = bg; roundRect(g, 4, 4, 312, 104, 40); g.fill();
  g.fillStyle = fg; g.font = '800 54px -apple-system,"Apple SD Gothic Neo",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 160, 60);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(w, w * 112 / 320, 1); sp.renderOrder = 10;
  return sp;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const lam = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });

function build() {
  renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight, false);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe6ff);
  scene.fog = new THREE.Fog(0xbfe6ff, 40, 70);
  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 120);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6fae5a, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(8, 20, 10); scene.add(sun);

  // 땅, 광장, 길
  ground = new THREE.Mesh(new THREE.CircleGeometry(30, 40), lam(0x8fd16a));
  ground.rotation.x = -Math.PI / 2; ground.userData.kind = 'ground'; scene.add(ground);
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(5.5, 32), lam(0xf3e2b8));
  plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0.01; scene.add(plaza);
  const pathMat = lam(0xf3e2b8);

  // 건물
  for (const d of BLD) {
    const [w, h, dep] = d.size;
    const grp = new THREE.Group();
    grp.position.set(d.pos[0], 0, d.pos[1]);
    grp.lookAt(0, 0, 0);
    const bodyC = d.open ? d.body : 0xc3c7cc, roofC = d.open ? d.roof : 0x8d939b;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, dep), lam(bodyC)); body.position.y = h / 2;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, dep) * 0.78, 2.4, 4), lam(roofC));
    roof.position.y = h + 1.2; roof.rotation.y = Math.PI / 4; roof.scale.z = dep / w;
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 0.2), lam(d.open ? 0x7a4a2a : 0x6c7178));
    door.position.set(0, 1.1, dep / 2 + 0.05);
    grp.add(body, roof, door);
    const tag = label(d.open ? d.name : '🔒 ' + d.name, d.open ? {} : { bg: 'rgba(80,88,100,.92)', fg: '#e8edf3' });
    tag.position.set(0, h + 3.2, 0); grp.add(tag);
    scene.add(grp);
    const dir = new THREE.Vector3(-d.pos[0], 0, -d.pos[1]).normalize();
    const doorPt = new THREE.Vector3(d.pos[0], 0, d.pos[1]).addScaledVector(dir, dep / 2 + 1.3);
    const b = { ...d, grp, tag, doorPt, armed: true };
    grp.traverse(o => { if (o.isMesh) o.userData.building = b; });
    buildings.push(b);
    colliders.push({ x: d.pos[0], z: d.pos[1], r: Math.max(w, dep) * 0.55 });
    // 광장에서 문까지 길
    const len = doorPt.length() - 5;
    const pathGrp = new THREE.Group();
    pathGrp.rotation.y = Math.atan2(-dir.x, -dir.z);
    const path = new THREE.Mesh(new THREE.PlaneGeometry(2, len), pathMat);
    path.rotation.x = -Math.PI / 2; path.position.set(0, 0.005, 5 + len / 2);
    pathGrp.add(path); scene.add(pathGrp);
  }

  // 열린 건물 표시 (위아래로 움직이는 별)
  const act = buildings[0];
  starMark = new THREE.Mesh(new THREE.OctahedronGeometry(0.7), lam(0xffe14d, { emissive: 0x665500 }));
  starMark.position.set(act.pos[0], act.size[1] + 5.4, act.pos[1]); scene.add(starMark);

  // 나무 (인스턴스 2개로 그리기)
  const trees = [];
  for (let i = 0; i < 26; i++) {
    const a = i / 26 * Math.PI * 2 + (i % 2) * .1, r = 19 + (i * 37 % 7);
    trees.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  trees.push([-5, -15], [5, -15], [-17, -1], [17, -1]);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.25, .3, 1.2, 6), lam(0x8a5a35), trees.length);
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(1.3, 2.8, 7), lam(0x3f9d4f), trees.length);
  const m4 = new THREE.Matrix4();
  trees.forEach(([x, z], i) => {
    trunk.setMatrixAt(i, m4.makeTranslation(x, .6, z));
    crown.setMatrixAt(i, m4.makeTranslation(x, 2.4, z));
    colliders.push({ x, z, r: .9 });
  });
  scene.add(trunk, crown);

  // 임시 캐릭터 (단순 도형)
  player = new THREE.Group();
  const pBody = new THREE.Mesh(new THREE.CylinderGeometry(.45, .6, 1.2, 12), lam(0x3c8dff)); pBody.position.y = .6;
  const pHead = new THREE.Mesh(new THREE.SphereGeometry(.45, 14, 10), lam(0xffd9b3)); pHead.position.y = 1.55;
  const pNose = new THREE.Mesh(new THREE.ConeGeometry(.12, .3, 6), lam(0xff7a5a)); pNose.position.set(0, 1.55, .48); pNose.rotation.x = Math.PI / 2;
  player.add(pBody, pHead, pNose);
  player.userData.body = [pBody, pHead, pNose];
  player.userData.body.forEach(m => m.userData.y0 = m.position.y);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(.7, 16), new THREE.MeshBasicMaterial({ color: 0, transparent: true, opacity: .2 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = .02; player.add(shadow);
  player.position.set(0, 0, 6);
  player.rotation.y = Math.PI;
  scene.add(player);

  // 안내 NPC 자리 (단순 도형)
  npc = new THREE.Group();
  const nBody = new THREE.Mesh(new THREE.ConeGeometry(.75, 1.8, 10), lam(0x9b6bd6)); nBody.position.y = .9;
  const nHead = new THREE.Mesh(new THREE.SphereGeometry(.45, 14, 10), lam(0xffe0c2)); nHead.position.y = 2.05;
  npc.add(nBody, nHead);
  const nTag = label('안내', { w: 2.2 }); nTag.position.y = 3.2; npc.add(nTag);
  npc.position.set(-3, 0, 1.5); npc.lookAt(0, 0, 6);
  scene.add(npc);
  colliders.push({ x: npc.position.x, z: npc.position.z, r: .9 });

  // 터치 위치 표시
  marker = new THREE.Mesh(new THREE.RingGeometry(.35, .55, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
  marker.rotation.x = -Math.PI / 2; marker.position.y = .03; scene.add(marker);

  updateCamera(1);
  addEventListener('resize', onResize);
  $('#c').addEventListener('pointerdown', onTap);
}

function onResize() {
  if (!renderer) return;
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}

/* ---------- 조작: 터치한 곳으로 이동 ---------- */
let target = null, goal = null, markerT = 0;
let raycaster = null;
function onTap(e) {
  if (paused) return;
  e.preventDefault();
  if (!raycaster) raycaster = new THREE.Raycaster();
  const v = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(v, camera);
  const hits = raycaster.intersectObjects([...buildings.map(b => b.grp), ground], true);
  const h = hits.find(x => x.object.isMesh);
  if (!h) return;
  const b = h.object.userData.building;
  if (b) {
    target = b.doorPt.clone(); goal = b;
    if (!b.open) shake(b);
  } else {
    const p = h.point.clone(); p.y = 0;
    if (p.length() > 24) p.setLength(24);
    target = p; goal = null;
  }
  marker.position.set(target.x, .03, target.z); markerT = 1;
}
const shakes = [];
function shake(b) { shakes.push({ b, t: 0 }); }

/* ---------- 매 프레임 ---------- */
let paused = false;
const loop = { last: 0, n: 0, t0: 0, fps: 0, minFps: Infinity, ms: 0 };
const SPEED = 6;
function frame(now) {
  if (paused) return;
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - loop.last) / 1000); loop.last = now;
  update(dt, now / 1000);
  const t1 = performance.now();
  renderer.render(scene, camera);
  loop.ms = loop.ms * .9 + (performance.now() - t1) * .1;
  loop.n++;
  if (!loop.t0) loop.t0 = now;
  if (now - loop.t0 >= 1000) {
    loop.fps = Math.round(loop.n * 1000 / (now - loop.t0)); loop.n = 0; loop.t0 = now;
    if (now - T.ready > 2000) loop.minFps = Math.min(loop.minFps, loop.fps);
    status();
  }
}

function update(dt, t) {
  const p = player.position;
  let moving = false;
  if (target) {
    const d = new THREE.Vector3().subVectors(target, p); d.y = 0;
    const dist = d.length();
    if (dist < .08) { target = null; arrive(); }
    else {
      const step = Math.min(dist, SPEED * dt);
      d.normalize();
      p.addScaledVector(d, step);
      for (const c of colliders) {
        const dx = p.x - c.x, dz = p.z - c.z, r = c.r + .5, dd = Math.hypot(dx, dz);
        if (dd < r && dd > 1e-4) { p.x = c.x + dx / dd * r; p.z = c.z + dz / dd * r; }
      }
      const ang = Math.atan2(d.x, d.z);
      player.rotation.y += wrap(ang - player.rotation.y) * Math.min(1, dt * 12);
      moving = true;
    }
  }
  // 걷는 모양
  const bob = moving ? Math.abs(Math.sin(t * 12)) * .15 : 0;
  player.userData.body.forEach(m => m.position.y = m.userData.y0 + bob);

  // 활동놀이 건물에 다가가면 입장
  const act = buildings[0];
  const dDoor = p.distanceTo(act.doorPt);
  if (dDoor > 4) act.armed = true;
  if (act.armed && dDoor < 1.6) enter(act);

  starMark.position.y = act.size[1] + 5.4 + Math.sin(t * 2.5) * .35; starMark.rotation.y = t * 1.5;
  if (markerT > 0) { markerT = Math.max(0, markerT - dt * 1.5); marker.material.opacity = markerT * .8; marker.scale.setScalar(1 + (1 - markerT) * .6); }
  for (let i = shakes.length - 1; i >= 0; i--) {
    const s = shakes[i]; s.t += dt;
    s.b.tag.material.rotation = Math.sin(s.t * 40) * .12 * Math.max(0, 1 - s.t / .5);
    if (s.t > .5) { s.b.tag.material.rotation = 0; shakes.splice(i, 1); }
  }
  updateCamera(dt);
}
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

function arrive() {
  if (goal && goal.open) enter(goal);
  goal = null;
}

// 카메라는 캐릭터를 따라가되, 마을 중심 쪽으로 조금 당겨 건물 이름이 보이게 둡니다
const camOff = [0, 23, 19], LOOK_AHEAD = 4;
function updateCamera(dt) {
  const p = player.position;
  const k = Math.min(1, dt * 4);
  const fx = p.x * .6, fz = p.z * .6 - LOOK_AHEAD;
  camera.position.x += (fx + camOff[0] - camera.position.x) * k;
  camera.position.y += (camOff[1] - camera.position.y) * k;
  camera.position.z += (fz + camOff[2] - camera.position.z) * k;
  camera.lookAt(camera.position.x - camOff[0], 0, camera.position.z - camOff[2]);
}

/* ---------- 활동놀이 입장 / 돌아오기 ---------- */
function enter(b) {
  b.armed = false; target = null; goal = null;
  paused = true;
  show('s-select');
  status();
}
$('#back').onclick = () => {
  const act = buildings[0];
  const back = act.doorPt.clone().add(act.doorPt.clone().setLength(-3.2));
  player.position.copy(back); player.rotation.y = Math.atan2(-back.x, -back.z);
  show('');
  paused = false; loop.last = performance.now(); loop.t0 = 0; loop.n = 0;
  requestAnimationFrame(frame);
};

/* ---------- 상태 표시 ---------- */
const sec = (a, b = T0) => a ? ((a - b) / 1000).toFixed(1) + '초' : '-';
function status() {
  if (!renderer) return;
  const info = renderer.info.render;
  const fc = loop.fps >= 30 ? 'ok' : loop.fps >= 24 ? 'warn' : 'bad';
  $('#status').innerHTML = `
    <div><b>fps</b> <span class="${paused ? '' : fc}">${paused ? '멈춤(미션 화면)' : loop.fps}</span> · <b>최저</b> ${isFinite(loop.minFps) ? loop.minFps : '-'} · <b>그리기</b> ${loop.ms.toFixed(1)}ms</div>
    <div><b>첫 화면→마을 조작</b> <span class="ok">${sec(T.ready)}</span> · START→ ${sec(T.ready, T.start)}</div>
    <div><b>3D 엔진</b> ${sec(T.three)} · <b>마을 생성</b> ${T.scene && T.start ? ((T.scene - Math.max(T.start, T.three)) / 1000).toFixed(2) + '초' : '-'}</div>
    <div><b>화면</b> ${innerWidth}×${innerHeight} ×${DPR} · <b>draw</b> ${info.calls} · <b>삼각형</b> ${info.triangles}</div>
    <div><b>소리</b> ${audio ? audio.state : '없음'}</div>`;
}
</script>
</body>
</html>
