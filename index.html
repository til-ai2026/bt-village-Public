<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BT Village MVP 프로토타입</title>
<style>
:root{--bg:#fff7e8;--card:#ffffff;--ink:#3b2a1a;--sub:#7a6450;--main:#f08a24;--ok:#3aa655;--lock:#d9d2c7;--line:#ecdcc3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a10;--card:#33261a;--ink:#fbeedb;--sub:#c8b49c;--lock:#4a3d30;--line:#4d3b29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241a10;--card:#33261a;--ink:#fbeedb;--sub:#c8b49c;--lock:#4a3d30;--line:#4d3b29;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100%;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.teacher{display:flex;gap:10px;align-items:flex-start}
.teacher .av{font-size:38px;line-height:1}
.teacher .say{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:15px;flex:1}
button{font:inherit;border:0;border-radius:14px;background:var(--main);color:#fff;font-weight:700;padding:14px 18px;font-size:17px;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:2px solid var(--line);font-size:14px;padding:10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{border-radius:16px;padding:16px 8px;text-align:center;background:var(--card);border:2px solid var(--line);font-weight:700}
.b .e{font-size:34px;display:block}
.b small{display:block;font-weight:500;color:var(--sub);margin-top:4px}
.b.open{border-color:var(--main)}
.b.lock{background:var(--lock);opacity:.75}
.b.new{border-color:var(--ok);animation:p 1s 3}
@keyframes p{50%{transform:scale(1.06)}}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.target{font-size:96px;text-align:center;margin:6px 0;line-height:1.1}
.word{text-align:center;font-size:28px;font-weight:800}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;margin-top:10px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .zone{position:absolute;left:0;right:0;top:0;height:50%;border-bottom:2px dashed rgba(255,255,255,.8);color:#fff;font-size:12px;padding:4px 8px}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--main);width:0}
.hide{display:none}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<h1>🏘️ BT Village</h1>
<p class="sub">MVP 프로토타입 · 움직임 점검 단계</p>

<section id="s-start">
  <div class="card teacher"><div class="av">🐻</div><div class="say">안녕! 나는 Brown Teacher야. 카메라 앞에서 손을 들어 미션을 해볼까요? 카메라 영상은 저장되거나 전송되지 않아요.</div></div>
  <div class="card"><b>보호자 안내</b><p class="sub">폰을 세워 두고, 아이 상체가 보이게 1.5~2m 떨어져 주세요. 밝은 곳이 좋아요. 카메라가 안 되면 버튼으로 진행할 수 있어요.</p></div>
  <button id="go">시작하기 (카메라 허용)</button>
</section>

<section id="s-hub" class="hide">
  <div class="card teacher"><div class="av">🐻</div><div class="say" id="hubsay"></div></div>
  <div class="card"><b id="prog">활동놀이 0 / 10</b><div class="bar"><i id="bar"></i></div></div>
  <div class="grid" id="grid"></div>
  <div style="height:12px"></div>
  <button id="enter">활동놀이 미션 시작</button>
</section>

<section id="s-play" class="hide">
  <div class="card">
    <div class="sub" id="pl-n"></div>
    <div class="target" id="pl-e"></div>
    <div class="word" id="pl-w"></div>
    <p class="sub" style="text-align:center" id="pl-t">Raise your hand! 손을 높이 들어요</p>
    <div class="cam"><video id="v" playsinline muted autoplay></video><div class="zone">어깨보다 높이 손을 올려요 🙋</div></div>
    <div class="meter"><i id="m"></i></div>
    <p class="sub" id="camstat"></p>
  </div>
  <button class="ghost" id="skip">손 들었어요 (버튼으로 넘기기)</button>
</section>

<section id="s-end" class="hide">
  <div class="card teacher"><div class="av">🐻</div><div class="say">Great job! 과학 건물이 열렸어요!</div></div>
  <div class="card"><b>움직임 점검 결과</b><div id="stats"></div></div>
  <button id="back">마을로 돌아가기</button>
</section>

<script>
var M=[["🍎","Apple"],["🍌","Banana"],["⭐","Star"],["⚽","Ball"],["🐱","Cat"],["🌸","Flower"],["🚗","Car"],["📘","Book"],["☀️","Sun"],["🐟","Fish"]];
var st={cleared:0,idx:0,stream:null,ok:0,fb:0,times:[],t0:0,hits:0,prev:null,timer:null,done:false};
var $=function(i){return document.getElementById(i)};
function show(id){["s-start","s-hub","s-play","s-end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function hub(){
  var unlocked=st.cleared>=10;
  $("hubsay").textContent=unlocked?"Great job! 다음 건물이 열렸어요!":"활동놀이 건물에서 미션 10개를 모아 보자!";
  $("prog").textContent="활동놀이 "+Math.min(st.cleared,10)+" / 10";
  $("bar").style.width=Math.min(st.cleared,10)*10+"%";
  var B=[["🤸","활동놀이","열림",1],["🔬","과학",unlocked?"새로 열림":"잠김",unlocked],["🔢","수학","잠김",0],["🎵","음악","잠김",0],["📖","My BT Story","잠김",0]];
  $("grid").innerHTML=B.map(function(b,i){var c=b[3]?(i===1?"b new":"b open"):"b lock";return '<div class="'+c+'"><span class="e">'+(b[3]?b[0]:"🔒")+'</span>'+b[1]+'<small>'+b[2]+'</small></div>'}).join("");
  $("enter").classList.toggle("hide",unlocked);
  show("s-hub");
}
function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("camstat").textContent="카메라를 쓸 수 없어요. 버튼으로 진행해요.";return Promise.resolve(false)}
  return navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){st.stream=s;$("v").srcObject=s;initPose();return true}).catch(function(){$("camstat").textContent="카메라 허용이 안 됐어요. 버튼으로 진행해요.";return false});
}
function mission(){
  var m=M[st.idx%M.length];
  $("pl-n").textContent="미션 "+(st.idx+1)+" / 10";
  $("pl-e").textContent=m[0];$("pl-w").textContent=m[1];
  $("m").style.width="0";st.hits=0;st.prev=null;st.done=false;st.t0=Date.now();
  show("s-play");
  setTimeout(function(){speak("Raise your hand! "+m[1])},300);
  clearInterval(st.timer);
  st.timer=setInterval(detect,100);
}
var cv=document.createElement("canvas");cv.width=64;cv.height=48;var cx=cv.getContext("2d",{willReadFrequently:true});
var pose=null;
function initPose(){
  $("camstat").textContent="AI 관절 인식 준비 중… (처음엔 몇 초 걸려요)";
  import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm").then(function(mp){
    return mp.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm").then(function(fs){
      function mk(d){return mp.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},runningMode:"VIDEO",numPoses:1})}
      return mk("GPU").catch(function(){return mk("CPU")});
    });
  }).then(function(p){pose=p;$("camstat").textContent="관절 인식 켜짐 ✅"}).catch(function(){$("camstat").textContent="간단 움직임 감지 모드 (관절 인식을 불러오지 못했어요)"});
}
function detect(){
  var v=$("v");if(st.done||!st.stream||v.readyState<2)return;
  if(!pose){detectMotion();return}
  var lm;try{var r=pose.detectForVideo(v,performance.now());lm=r.landmarks&&r.landmarks[0]}catch(e){return}
  if(!lm){st.hits=0;$("m").style.width="0";$("camstat").textContent="몸이 안 보여요. 뒤로 물러나 주세요";return}
  $("camstat").textContent="관절 인식 켜짐 ✅";
  function up(w,s){return lm[w].visibility>0.5&&lm[s].visibility>0.5&&lm[w].y<lm[s].y-0.05}
  var raised=up(15,11)||up(16,12);
  st.hits=raised?st.hits+1:0;
  $("m").style.width=Math.min(100,st.hits*100/4)+"%";
  if(st.hits>=4)clear(false);
}
function detectMotion(){
  var v=$("v");if(st.done||!st.stream||v.readyState<2)return;
  cx.drawImage(v,0,0,64,48);
  var d=cx.getImageData(0,0,64,24).data,g=new Uint8Array(64*24);
  for(var i=0;i<g.length;i++)g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  if(st.prev){var c=0;for(var j=0;j<g.length;j++){if(Math.abs(g[j]-st.prev[j])>28)c++}
    var r=c/g.length;st.hits=r>0.05?st.hits+1:Math.max(0,st.hits-1);
    $("m").style.width=Math.min(100,st.hits*100/6)+"%";
    if(st.hits>=6)clear(false)}
  st.prev=g;
}
function clear(fallback){
  if(st.done)return;st.done=true;clearInterval(st.timer);
  if(fallback)st.fb++;else st.ok++;
  st.times.push(Date.now()-st.t0);
  st.cleared++;st.idx++;
  $("pl-e").textContent="✅";$("pl-w").textContent="Good job!";speak("Good job!");
  setTimeout(function(){
    if(st.cleared>=10){endScreen()}else{mission()}
  },1100);
}
function endScreen(){
  if(st.stream){st.stream.getTracks().forEach(function(t){t.stop()});st.stream=null}
  var avg=st.times.length?Math.round(st.times.reduce(function(a,b){return a+b},0)/st.times.length/100)/10:0;
  $("stats").innerHTML='<div class="stat"><span>카메라로 인식 성공</span><b>'+st.ok+' / 10</b></div><div class="stat"><span>버튼으로 넘김</span><b>'+st.fb+' / 10</b></div><div class="stat"><span>평균 반응 시간</span><b>'+avg+'초</b></div>';
  speak("Great job! The science building is open!");
  show("s-end");
}
$("go").onclick=function(){speak("Hello!");startCam().then(function(){hub()})};
$("enter").onclick=function(){if(!st.stream)startCam();mission()};
$("skip").onclick=function(){clear(true)};
$("back").onclick=function(){hub()};
</script>
</body>
</html>
