<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Color Balloons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff4757; --red-d: #c0392b;
    --yellow: #ffd32a; --yellow-d: #d4a106;
    --blue: #3d9bff; --blue-d: #1c6fd1;
    --ink: #2d3561;
    --sky1: #8fd3ff; --sky2: #dff4ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: 'Jua', 'Apple SD Gothic Neo', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky1), var(--sky2));
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }

  /* 구름 배경 */
  .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .85; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 55%; height: 160%; left: 15%; top: -70%; }
  .cloud::after { width: 40%; height: 130%; right: 12%; top: -45%; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  /* 화면 전환 */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
  .screen.on { display: flex; }
  h1 { font-size: clamp(44px, 8vw, 96px); margin: 0; font-weight: normal; letter-spacing: 1px; text-shadow: 0 4px 0 #fff; }
  .ko { font-size: clamp(20px, 3vw, 32px); opacity: .75; margin-top: 6px; }
  .big-btn {
    font-family: inherit; font-size: clamp(36px, 6vw, 64px); color: #fff;
    background: #ff7a45; border: none; border-radius: 999px;
    padding: 18px 72px; margin-top: 40px;
    box-shadow: 0 10px 0 #c4531f, 0 14px 30px rgba(0,0,0,.2);
    cursor: pointer; animation: bounce 1.4s ease-in-out infinite;
  }
  .big-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #c4531f; animation: none; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .title-balloons { display: flex; gap: 18px; margin-bottom: 18px; }
  .title-balloons svg { width: clamp(70px, 10vw, 120px); animation: bob 2.4s ease-in-out infinite; }
  .title-balloons svg:nth-child(2) { animation-delay: .4s; }
  .title-balloons svg:nth-child(3) { animation-delay: .8s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }

  /* 색 선택 */
  .choices { display: flex; gap: clamp(20px, 5vw, 64px); margin-top: 36px; }
  .choice {
    background: rgba(255,255,255,.7); border: 6px solid transparent; border-radius: 32px;
    padding: 18px 22px 12px; cursor: pointer; font-family: inherit; color: var(--ink);
    font-size: clamp(28px, 4vw, 44px); display: flex; flex-direction: column; align-items: center;
    transition: transform .15s;
  }
  .choice svg { width: clamp(100px, 15vw, 170px); animation: bob 2.4s ease-in-out infinite; }
  .choice:nth-child(2) svg { animation-delay: .5s; }
  .choice:nth-child(3) svg { animation-delay: 1s; }
  .choice:active { transform: scale(.94); }
  .choice.picked { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255,255,255,.6); }
  .choice small { font-size: .55em; opacity: .7; }

  /* 시범 */
  #demo .demo-row { display: flex; align-items: center; gap: clamp(20px, 5vw, 60px); margin-top: 20px; }
  #demo .demo-row svg { width: clamp(120px, 18vw, 200px); animation: bob 2.4s ease-in-out infinite; }
  .kid { font-size: clamp(110px, 16vw, 190px); line-height: 1; }
  .kid.wave { animation: wave .9s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg) translateY(-10px); } }
  .instr { font-size: clamp(30px, 4.6vw, 54px); margin-top: 18px; line-height: 1.25; }
  .instr b { font-weight: normal; padding: 0 .2em; border-radius: 12px; color: #fff; }

  /* 플레이 HUD */
  #hud { position: absolute; top: 0; left: 0; right: 0; display: none; justify-content: center; align-items: center; gap: 24px; padding: 14px 16px; z-index: 20; pointer-events: none; }
  #hud.on { display: flex; }
  #slots { display: flex; gap: 10px; background: rgba(255,255,255,.75); padding: 8px 18px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .slot { width: 52px; height: 72px; position: relative; }
  .slot svg { width: 100%; height: 100%; }
  .slot .empty { opacity: .22; filter: grayscale(1); }
  .slot.fill svg { animation: popIn .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes popIn { from { transform: scale(.2); } to { transform: scale(1); } }
  #progress { background: rgba(255,255,255,.75); padding: 10px 20px; border-radius: 999px; font-size: 26px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }

  #stage { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .balloon { position: absolute; left: 0; top: 0; width: 170px; height: 255px; transform-origin: 50% 35%; will-change: transform; }
  .balloon svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.15)); }
  .balloon.shake svg { animation: shake .45s ease-in-out 2; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

  /* 안내 문구 / 자막 */
  #caption {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(255,255,255,.92); padding: 12px 30px; border-radius: 26px;
    font-size: clamp(26px, 3.6vw, 40px); z-index: 30; max-width: 70vw; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.15); display: none;
  }
  #caption.on { display: block; animation: popIn .25s ease-out; }
  #prompt {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%);
    font-size: clamp(40px, 6vw, 72px); z-index: 25; display: none; text-align: center;
    background: rgba(255,255,255,.85); padding: 20px 44px; border-radius: 40px;
  }
  #prompt.on { display: block; }
  #prompt .ko { font-size: .45em; }
  #pop {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(0);
    font-size: clamp(90px, 14vw, 170px); z-index: 26; color: #fff; text-align: center; line-height: 1;
    text-shadow: 0 6px 0 rgba(0,0,0,.18); pointer-events: none;
  }
  #pop small { display: block; font-size: .4em; }
  #pop.show { animation: numPop 1.1s ease-out forwards; }
  @keyframes numPop {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    25% { transform: translate(-50%,-50%) scale(1.15); }
    40% { transform: translate(-50%,-50%) scale(1); }
    80% { opacity: 1; }
    100% { transform: translate(-50%,-60%) scale(1); opacity: 0; }
  }

  /* 카메라 */
  #cam { position: absolute; right: 16px; bottom: 16px; width: clamp(180px, 22vw, 260px); aspect-ratio: 4/3; border-radius: 20px; overflow: hidden; background: #234; z-index: 22; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.2); display: none; }
  #cam.on { display: block; }
  #cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #camStatus { position: absolute; left: 6px; right: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 15px; padding: 4px 8px; border-radius: 10px; text-align: center; }
  #cam.up { border-color: #3ddc84; }

  /* 테스트 손들기 버튼 */
  #testBtn {
    position: absolute; left: 16px; bottom: 16px; z-index: 40;
    width: 120px; height: 120px; border-radius: 50%; border: 4px dashed #fff;
    background: rgba(45,53,97,.55); color: #fff; font-family: inherit; font-size: 18px; line-height: 1.15;
    display: none; touch-action: none; cursor: pointer;
  }
  #testBtn.on { display: block; }
  #testBtn .e { font-size: 44px; display: block; }
  #testBtn.held { background: rgba(61,220,132,.85); transform: scale(.95); }
  #holdRing { position: absolute; inset: -10px; pointer-events: none; }

  /* 완료 */
  #bundle { position: relative; width: 320px; height: 300px; margin-bottom: 10px; }
  #bundle svg { position: absolute; width: 110px; animation: bob 2.4s ease-in-out infinite; }
  .confetti { position: absolute; width: 12px; height: 18px; top: -20px; z-index: 50; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  #complete .big-btn { font-size: clamp(28px, 4vw, 44px); padding: 14px 50px; margin-top: 26px; }
</style>
</head>
<body>
<div id="app">
  <div class="cloud" style="width:180px;height:50px;top:12%;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="width:240px;height:64px;top:30%;animation-duration:95s;animation-delay:-60s"></div>
  <div class="cloud" style="width:140px;height:40px;top:62%;animation-duration:80s;animation-delay:-5s"></div>

  <div id="stage"></div>

  <div id="hud">
    <div id="slots"></div>
    <div id="progress">🎈 1 / 10</div>
  </div>

  <!-- 1. 시작 -->
  <section class="screen on" id="start">
    <div class="title-balloons" id="titleBalloons"></div>
    <h1>My Color Balloons</h1>
    <div class="ko">내 색깔 풍선 모으기</div>
    <button class="big-btn" id="startBtn">START</button>
  </section>

  <!-- 2. 색 선택 -->
  <section class="screen" id="select">
    <h1 style="font-size:clamp(40px,6.5vw,76px)">Choose your color!</h1>
    <div class="ko">내 색깔을 골라요</div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- 3. 손들기 시범 -->
  <section class="screen" id="demo">
    <div class="demo-row">
      <div id="demoBalloon"></div>
      <div class="kid wave" id="demoKid">🙋</div>
    </div>
    <div class="instr" id="demoText"></div>
    <div class="ko" id="demoKo"></div>
  </section>

  <!-- 5. 완료 -->
  <section class="screen" id="complete">
    <div id="bundle"></div>
    <h1>You did it!</h1>
    <div class="instr" id="completeText"></div>
    <div class="ko">풍선을 모두 모았어요!</div>
    <button class="big-btn" id="againBtn">Play again</button>
  </section>

  <div id="prompt"></div>
  <div id="pop"></div>
  <div id="caption"></div>

  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="camStatus">카메라 준비 중…</div>
  </div>

  <button id="testBtn" aria-label="손들기 테스트 버튼">
    <span class="e">🙋</span>꾹 누르기<br>/ Space
    <svg id="holdRing" viewBox="0 0 140 140"><circle cx="70" cy="70" r="66" fill="none" stroke="#3ddc84" stroke-width="8" stroke-linecap="round" stroke-dasharray="415" stroke-dashoffset="415" transform="rotate(-90 70 70)" id="holdArc"/></svg>
  </button>
</div>

<script type="module">
/* ================= 설정 ================= */
const COLORS = {
  red:    { name: 'Red',    ko: '빨강', fill: '#ff4757', dark: '#c0392b' },
  yellow: { name: 'Yellow', ko: '노랑', fill: '#ffd32a', dark: '#d4a106' },
  blue:   { name: 'Blue',   ko: '파랑', fill: '#3d9bff', dark: '#1c6fd1' },
};
const NUM = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five'];
const GOAL = 5;              // 모을 내 색 풍선 수
const OTHER = 5;             // 다른 색 풍선 수
const HOLD_MS = 300;         // 손 올림 인정 시간
const DOWN_MS = 250;         // 손 내림 인정 시간
const FLOAT_MS = 7000;       // 풍선이 화면을 지나가는 시간

const MP_VER = '0.10.14';
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function balloonSVG(c) {
  const k = COLORS[c];
  return `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 101 q-7 12 1 24 t-2 25" stroke="#7a7a7a" stroke-width="1.6" fill="none"/>
    <path d="M44 103 L56 103 L50 94 Z" fill="${k.dark}"/>
    <ellipse cx="50" cy="48" rx="40" ry="48" fill="${k.fill}"/>
    <ellipse cx="50" cy="48" rx="40" ry="48" fill="none" stroke="${k.dark}" stroke-width="2" opacity=".35"/>
    <ellipse cx="35" cy="30" rx="9" ry="15" fill="#fff" opacity=".5" transform="rotate(-25 35 30)"/>
  </svg>`;
}

/* ================= 음성 (Web Speech API) ================= */
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'en-US' && /Samantha/i.test(v.name))
       || vs.find(v => v.lang === 'en-US')
       || vs.find(v => v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let captionTimer = 0;
function say(text, { rate = 0.88, caption = true } = {}) {
  if (caption) {
    const cap = $('caption');
    cap.textContent = text;
    cap.classList.remove('on'); void cap.offsetWidth; cap.classList.add('on');
    clearTimeout(captionTimer);
  }
  return new Promise(res => {
    let done = false;
    const fin = () => {
      if (done) return; done = true; clearTimeout(t);
      if (caption) captionTimer = setTimeout(() => $('caption').classList.remove('on'), 1200);
      res();
    };
    // iOS에서 onend가 안 오는 경우를 대비한 안전 타이머
    const t = setTimeout(fin, 1500 + text.length * 110);
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice;
    u.rate = rate; u.pitch = 1.15;
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  });
}

/* ================= 손들기 추적 ================= */
// raw = (포즈로 손목이 어깨 위) || (테스트 버튼/스페이스 누름)
// 0.3초 이상 유지 → raise 이벤트 1회. 손을 내려야(0.25초) 다시 발생 가능.
const hand = { pose: false, sim: false, upSince: 0, downSince: performance.now(), latched: false };
let onRaise = null;             // 현재 raise를 기다리는 콜백 (1회성)
let downWaiters = [];           // 손 내림을 기다리는 콜백들

function rawUp() { return hand.pose || hand.sim; }
function isDown(now = performance.now()) {
  return !rawUp() && !hand.latched && hand.downSince && now - hand.downSince >= DOWN_MS;
}
function tickHand(now) {
  const raw = rawUp();
  if (raw) {
    hand.downSince = 0;
    if (!hand.upSince) hand.upSince = now;
    if (!hand.latched && now - hand.upSince >= HOLD_MS) {
      hand.latched = true;
      if (onRaise) { const f = onRaise; onRaise = null; f(); }
    }
  } else {
    hand.upSince = 0;
    if (!hand.downSince) hand.downSince = now;
    if (hand.latched && now - hand.downSince >= DOWN_MS) hand.latched = false;
  }
  if (downWaiters.length && isDown(now)) downWaiters.splice(0).forEach(f => f());

  // UI
  const p = raw && !hand.latched ? Math.min(1, (now - hand.upSince) / HOLD_MS) : (hand.latched && raw ? 1 : 0);
  $('holdArc').setAttribute('stroke-dashoffset', 415 * (1 - p));
  $('cam').classList.toggle('up', raw);
}
const waitRaise = () => new Promise(r => { onRaise = r; });
const waitDown = () => new Promise(r => { if (isDown()) r(); else downWaiters.push(r); });

// 테스트 버튼: 터치(꾹 누르기) 또는 스페이스바
const tb = $('testBtn');
const simOn = () => { hand.sim = true; tb.classList.add('held'); };
const simOff = () => { hand.sim = false; tb.classList.remove('held'); };
tb.addEventListener('pointerdown', e => { e.preventDefault(); tb.setPointerCapture(e.pointerId); simOn(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => tb.addEventListener(ev, simOff));
tb.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) simOn(); } });
window.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); simOff(); } });

/* ================= 카메라 + MediaPipe Pose ================= */
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
let landmarker = null, lastVideoTime = -1, lastDetect = 0, camStarted = false;

function camStatus(t) { $('camStatus').textContent = t; }

async function startCamera() {
  if (camStarted) return; camStarted = true;
  $('cam').classList.add('on');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    console.warn('camera error', err);
    camStatus('카메라 없음 · 테스트 버튼 사용');
    return;
  }
  camStatus('포즈 모델 불러오는 중…');
  try {
    const { FilesetResolver, PoseLandmarker } = await import(`${MP_BASE}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const make = delegate => PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: POSE_MODEL, delegate },
      runningMode: 'VIDEO', numPoses: 1,
    });
    try { landmarker = await make('GPU'); }
    catch (e) { console.warn('GPU delegate failed, using CPU', e); landmarker = await make('CPU'); }
    camStatus('몸이 보이게 서 주세요');
  } catch (err) {
    console.warn('pose error', err);
    camStatus('포즈 인식 실패 · 테스트 버튼 사용');
  }
}

function detectPose(now) {
  if (!landmarker || video.readyState < 2) return;
  if (now - lastDetect < 33 || video.currentTime === lastVideoTime) return; // 약 30fps
  lastDetect = now; lastVideoTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, now); } catch (e) { return; }

  if (overlay.width !== video.videoWidth) { overlay.width = video.videoWidth; overlay.height = video.videoHeight; }
  octx.clearRect(0, 0, overlay.width, overlay.height);

  const lm = res.landmarks && res.landmarks[0];
  if (!lm) { hand.pose = false; camStatus('몸이 보이게 서 주세요'); return; }

  // 11/12 = 왼/오른 어깨, 15/16 = 왼/오른 손목 (y가 작을수록 위)
  const vis = p => (p.visibility ?? 1) > 0.5;
  const sides = [[11, 15], [12, 16]];
  let up = false;
  const W = overlay.width, H = overlay.height;
  for (const [s, w] of sides) {
    const S = lm[s], Wr = lm[w];
    if (!vis(S) || !vis(Wr)) continue;
    const sideUp = Wr.y < S.y;
    up = up || sideUp;
    octx.strokeStyle = 'rgba(255,255,255,.7)'; octx.lineWidth = 4;
    octx.beginPath(); octx.moveTo(S.x * W, S.y * H); octx.lineTo(Wr.x * W, Wr.y * H); octx.stroke();
    octx.fillStyle = '#ffd32a'; octx.beginPath(); octx.arc(S.x * W, S.y * H, 9, 0, 7); octx.fill();
    octx.fillStyle = sideUp ? '#3ddc84' : '#ff4757'; octx.beginPath(); octx.arc(Wr.x * W, Wr.y * H, 13, 0, 7); octx.fill();
  }
  hand.pose = up;
  camStatus(up ? '🙌 손 올림!' : '👍 준비 완료');
}

/* ================= 메인 루프 ================= */
const balloons = new Set();
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(50, now - lastFrame); lastFrame = now;
  detectPose(now);
  tickHand(now);
  const H = window.innerHeight;
  for (const b of balloons) {
    if (b.mode !== 'float') continue;
    b.y -= b.speed * dt;
    b.t += dt;
    const x = b.baseX + Math.sin(b.t / 700) * 22;
    b.x = x;
    b.el.style.transform = `translate(${x}px, ${b.y}px) rotate(${Math.sin(b.t / 700) * 4}deg)`;
    if (b.y < -b.h - 20) { b.mode = 'gone'; b.onExit && b.onExit(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= 풍선 순서 ================= */
function noTriple(arr) {
  for (let i = 2; i < arr.length; i++) if (arr[i] === arr[i - 1] && arr[i] === arr[i - 2]) return false;
  return true;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function makeSequence(my) {
  const others = Object.keys(COLORS).filter(c => c !== my);
  // 다른 색 5개: 두 색을 섞어서 (최소 2개씩)
  const nA = 2 + Math.floor(Math.random() * 2); // 2 또는 3
  const pool = [...Array(GOAL).fill(my), ...Array(nA).fill(others[0]), ...Array(OTHER - nA).fill(others[1])];
  let seq;
  do { seq = shuffle(pool.slice()); } while (!noTriple(seq));
  return seq;
}
// 놓친 내 색 풍선을 뒤쪽에 다시 넣기 (3연속 금지 유지)
function reinsert(color) {
  const n = queue.length;
  const minPos = n >= 2 ? 1 : 0;                 // 가능하면 바로 다음은 피함
  const positions = [];
  for (let p = minPos; p <= n; p++) positions.push(p);
  shuffle(positions);
  for (const p of positions) {
    const q = queue.slice(); q.splice(p, 0, color);
    if (noTriple(played.slice(-2).concat(q))) { queue = q; return; }
  }
  queue.push(color);
}

/* ================= 게임 상태 ================= */
let gen = 0, myColor = null, queue = [], played = [], collected = 0;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('hud').classList.toggle('on', id === 'play');
}
function setPrompt(html) { const p = $('prompt'); p.innerHTML = html || ''; p.classList.toggle('on', !!html); }
function popNumber(n) {
  const p = $('pop');
  p.innerHTML = `${n}<small>${NUM[n]}!</small>`;
  p.style.color = COLORS[myColor].fill;
  p.style.webkitTextStroke = `3px ${COLORS[myColor].dark}`;
  p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
}
function updateHud() {
  const total = played.length + queue.length;
  $('progress').textContent = `🎈 ${Math.min(played.length || 1, total)} / ${total}`;
}
function buildSlots() {
  $('slots').innerHTML = Array.from({ length: GOAL }, (_, i) =>
    `<div class="slot" id="slot${i}"><div class="empty">${balloonSVG(myColor)}</div></div>`).join('');
}

/* 1. 시작 */
$('titleBalloons').innerHTML = ['red', 'yellow', 'blue'].map(balloonSVG).join('');
$('startBtn').addEventListener('click', () => {
  // 사파리: 사용자 터치 안에서 음성/카메라를 처음 켜야 함
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }
  startCamera();
  $('testBtn').classList.add('on');
  goSelect();
});

/* 2. 색 선택 */
$('choices').innerHTML = Object.keys(COLORS).map(c =>
  `<button class="choice" data-c="${c}">${balloonSVG(c)}${COLORS[c].name}<small>${COLORS[c].ko}</small></button>`).join('');
let picking = false;
async function goSelect() {
  const g = ++gen;
  picking = false;
  document.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  show('select');
  await sleep(300);
  if (g === gen) say('Choose your color!');
}
$('choices').addEventListener('click', async e => {
  const btn = e.target.closest('.choice');
  if (!btn || picking) return;
  picking = true;
  const g = gen;
  myColor = btn.dataset.c;
  btn.classList.add('picked');
  await say(`${COLORS[myColor].name}! You are ${COLORS[myColor].name}.`);
  if (g === gen) goDemo();
});

/* 3. 손들기 시범 */
async function goDemo() {
  const g = ++gen;
  const c = COLORS[myColor];
  $('demoBalloon').innerHTML = balloonSVG(myColor);
  $('demoKid').textContent = '🙋';
  $('demoText').innerHTML = `See a <b style="background:${c.fill}">${c.name}</b> balloon?<br>Raise your hand!`;
  $('demoKo').textContent = `${c.ko} 풍선이 보이면 손을 번쩍 들어요!`;
  show('demo');
  await say(`When you see a ${c.name.toLowerCase()} balloon, raise your hand!`);
  if (g !== gen) return;

  // 먼저 손이 내려가 있어야 시작
  if (!isDown()) { $('demoText').textContent = 'Hands down first.'; $('demoKo').textContent = '먼저 손을 내려요'; await say('Hands down first.'); await waitDown(); }
  if (g !== gen) return;
  $('demoText').innerHTML = `Let's try!<br>Raise your hand!`;
  $('demoKo').textContent = '손을 머리 위로 올려 볼까요?';
  say("Let's try! Raise your hand!");
  await waitRaise();
  if (g !== gen) return;

  $('demoKid').textContent = '🌟';
  $('demoText').textContent = 'Great job!';
  $('demoKo').textContent = '잘했어요!';
  await say('Great job!');
  if (g !== gen) return;

  $('demoKid').textContent = '🙇';
  $('demoText').textContent = 'Now, hands down.';
  $('demoKo').textContent = '이제 손을 내려요. 손을 내려야 다음 풍선을 받을 수 있어요.';
  // 손을 이미 내렸어도 안내가 끝까지 나온 뒤 다음으로 넘어감
  await say('Now, hands down.');
  if (g !== gen) return;
  await waitDown();
  if (g !== gen) return;

  $('demoKid').textContent = '👍';
  $('demoText').innerHTML = `Other colors?<br>Keep your hands down!`;
  $('demoKo').textContent = '다른 색 풍선은 손을 내리고 기다려요';
  await say('Other colors? Keep your hands down!');
  if (g !== gen) return;
  $('demoText').textContent = "Let's go!";
  $('demoKo').textContent = '시작!';
  await say("Ready? Let's go!");
  if (g === gen) goPlay();
}

/* 4. 풍선 게임 */
function spawnBalloon(color) {
  const el = document.createElement('div');
  el.className = 'balloon';
  el.innerHTML = balloonSVG(color);
  $('stage').appendChild(el);
  const W = window.innerWidth, H = window.innerHeight;
  const w = el.offsetWidth, h = el.offsetHeight;
  const minX = W * 0.18, maxX = W * 0.68 - w;
  const b = {
    el, color, w, h, t: 0, mode: 'float',
    baseX: minX + Math.random() * Math.max(0, maxX - minX),
    y: H + 10, speed: (H + h + 30) / FLOAT_MS,
  };
  b.x = b.baseX;
  el.style.transform = `translate(${b.x}px, ${b.y}px)`;
  balloons.add(b);
  return b;
}
function removeBalloon(b) { balloons.delete(b); b.el.remove(); }

// 풍선 1개 진행 → 'raised' | 'exit'
function runBalloon(color) {
  return new Promise(res => {
    const b = spawnBalloon(color);
    say(`${COLORS[color].name}!`);
    onRaise = () => { if (b.mode === 'float') { b.mode = 'held'; res({ b, result: 'raised' }); } };
    b.onExit = () => { if (onRaise) onRaise = null; res({ b, result: 'exit' }); };
  });
}

function flyToSlot(b, i) {
  return new Promise(r => {
    const slot = $('slot' + i).getBoundingClientRect();
    const tx = slot.left + slot.width / 2 - b.w / 2;
    const ty = slot.top + slot.height / 2 - b.h * 0.35;
    b.el.style.transition = 'transform .8s cubic-bezier(.5,-0.3,.6,1)';
    b.el.style.transform = `translate(${tx}px, ${ty}px) scale(.3)`;
    setTimeout(() => {
      removeBalloon(b);
      const s = $('slot' + i);
      s.classList.add('fill');
      s.innerHTML = balloonSVG(myColor);
      r();
    }, 820);
  });
}
function flyAway(b) {
  b.el.classList.add('shake');
  setTimeout(() => {
    b.el.style.transition = 'transform 1s ease-in, opacity 1s';
    b.el.style.transform = `translate(${b.x + 120}px, ${-b.h - 200}px) rotate(20deg)`;
    b.el.style.opacity = '0';
    setTimeout(() => removeBalloon(b), 1050);
  }, 900);
}

async function goPlay() {
  const g = ++gen;
  collected = 0;
  played = [];
  queue = makeSequence(myColor);
  buildSlots();
  updateHud();
  show('play');
  await sleep(600);

  while (queue.length) {
    if (g !== gen) return;
    // 손을 내려야 다음 풍선을 받을 수 있음
    if (!isDown()) {
      setPrompt(`✋⬇️ Hands down!<div class="ko">손을 내려요</div>`);
      say('Hands down, please.');
      await waitDown();
      if (g !== gen) return;
      setPrompt('');
      await sleep(400);
    }
    const color = queue.shift();
    played.push(color);
    updateHud();
    const mine = color === myColor;
    const { b, result } = await runBalloon(color);
    if (g !== gen) return;

    if (mine && result === 'raised') {
      collected++;
      popNumber(collected);
      say(`${NUM[collected]}!`, { rate: 0.8 });
      await flyToSlot(b, collected - 1);
    } else if (mine) {
      reinsert(color);
      updateHud();
      removeBalloon(b);
      await say(`Oh, it flew away! It will come back.`);
    } else if (result === 'raised') {
      flyAway(b);
      await say(`Oops! It's ${COLORS[color].name.toLowerCase()}. Not your color.`);
    } else {
      removeBalloon(b);
      await say('Good waiting!');
    }
    await sleep(700);
  }
  if (g === gen) goComplete();
}

/* 5. 완료 */
async function goComplete() {
  const g = ++gen;
  setPrompt('');
  const c = COLORS[myColor];
  const pos = [[105, 0], [20, 40], [190, 40], [60, 95], [150, 95]];
  $('bundle').innerHTML = pos.map(([x, y], i) =>
    `<div style="position:absolute;left:${x}px;top:${y}px">${balloonSVG(myColor).replace('<svg', `<svg style="animation-delay:${i * .3}s;opacity:.25"`)}</div>`).join('');
  $('completeText').innerHTML = `<b style="background:${c.fill}">Five ${c.name}</b> balloons!`;
  show('complete');
  confetti();
  await say(`You did it! You got five ${c.name.toLowerCase()} balloons!`);
  // 하나씩 세기
  const svgs = $('bundle').querySelectorAll('svg');
  for (let i = 0; i < GOAL; i++) {
    if (g !== gen) return;
    svgs[i].style.opacity = '1';
    svgs[i].parentElement.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 400, easing: 'ease-out' });
    await say(`${NUM[i + 1]}!`, { rate: 0.85 });
    await sleep(150);
  }
  if (g === gen) say('Great job!');
}
function confetti() {
  const cols = ['#ff4757', '#ffd32a', '#3d9bff', '#3ddc84', '#ff7a45'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[i % cols.length];
    d.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    d.style.animationDelay = Math.random() * 1.2 + 's';
    $('app').appendChild(d);
    setTimeout(() => d.remove(), 6500);
  }
}
$('againBtn').addEventListener('click', () => {
  for (const b of [...balloons]) removeBalloon(b);
  onRaise = null; downWaiters = [];
  goSelect();
});
</script>
