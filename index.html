<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>노리나루마을 · 동작 인식 기록 보기</title>
<style>
body{font-family:-apple-system,"Malgun Gothic",sans-serif;margin:0;padding:20px;background:#f6f7f9;color:#222}
h1{font-size:20px;color:#1F3A5F;margin:0 0 6px}
p.note{font-size:13px;color:#666;margin:0 0 16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.total{font-size:15px}
.big{font-size:34px;font-weight:700;color:#E8833A}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #eee;padding:8px 4px;text-align:center}
th{color:#1F3A5F}
td:first-child,th:first-child{text-align:left}
button{margin-top:8px;padding:10px 14px;border:0;border-radius:8px;background:#1F3A5F;color:#fff;font-size:14px}
pre{white-space:pre-wrap;font-size:12px;background:#f0f0f0;padding:8px;border-radius:6px}
</style></head><body>
<h1>동작 인식 기록 보기</h1>
<p class="note">이 기기·이 브라우저에 저장된 테스트 기록만 보입니다. 서버로 보내지 않습니다.<br>인식 완료 비율 = 카메라 인식 ÷ (카메라 인식 + "했어요" 버튼 + 화면 터치)</p>
<div id="out"></div>
<script>
const NAMES={};
function load(){try{return JSON.parse(localStorage.getItem('bt-progress-v1'))}catch(e){return null}}
const p=load(), out=document.getElementById('out');
if(!p||!p.missions||!Object.keys(p.missions).length){
  out.innerHTML='<div class="card">저장된 기록이 없습니다. 테스트할 때 쓴 기기와 브라우저에서 열었는지 확인해 주세요.</div>';
}else{
  let C=0,M=0,T=0,rows='';
  for(const [id,r] of Object.entries(p.missions)){
    const c=r.camera||0,m=r.manual||0,t=r.touch||0,n=c+m+t; C+=c;M+=m;T+=t;
    rows+=`<tr><td>${id}</td><td>${r.clears||0}</td><td>${c}</td><td>${m}</td><td>${t}</td><td>${n?Math.round(c/n*1000)/10+'%':'-'}</td></tr>`;
  }
  const N=C+M+T, rate=N?Math.round(C/N*1000)/10:0;
  out.innerHTML=`<div class="card total">전체 인식 완료 비율<div class="big">${N?rate+'%':'-'}</div>카메라 ${C}회 · 버튼 ${M}회 · 터치 ${T}회 (총 ${N}회) · 누적 클리어 ${p.total||0}회</div>
  <div class="card"><table><tr><th>미션</th><th>클리어</th><th>카메라</th><th>버튼</th><th>터치</th><th>비율</th></tr>${rows}</table></div>
  <div class="card"><button id="copy">기록 원본 복사</button><pre id="raw"></pre></div>`;
  document.getElementById('raw').textContent=JSON.stringify(p,null,1);
  document.getElementById('copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(p)).then(()=>{document.getElementById('copy').textContent='복사했습니다'})};
}
</script></body></html>
